[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "measure-station-db"
dynamic = ["version"]
description = "Raspberry Pi server that stores Measure Station readings from MQTT in PostgreSQL + TimescaleDB, and presents them on a TV and phones."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.dynamic]
version = { attr = "measure_station_db.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
